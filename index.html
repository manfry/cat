<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11111f">
  <title>Caccia al tesoro</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Caccia al tesoro">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Caccia al <span class="brand-light">tesoro</span></span>
      </a>
    </header>

    <section class="intro">
      <!-- <p class="eyebrow">La prossima tappa ti aspetta</p> -->
      <!-- <h1>Caccia al tesoro</h1> -->
      <p class="subtitle">Hai trovato la parola segreta? Inseriscila per accedere all'enigma</p>
    </section>

    <section class="card" aria-labelledby="question-title">
      <!-- <div class="treasure-icon" aria-hidden="true">🔎</div> -->
      <h2 id="question-title">Qual è la parola?</h2>
      <form id="answerForm" novalidate>
        <label for="answer">La tua risposta:</label>
        <div class="answer-row">
          <input
            id="answer"
            name="answer"
            type="text"
            placeholder="Scrivi la parola..."
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            required
          >
          <button type="submit">Verifica</button>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </form>
      <!-- <p class="hint">Attenzione: </p> -->
    </section>
    <footer>Suggerimento: non importa se usi maiuscole o minuscole.</footer>
  </main>
</body>
</html>
